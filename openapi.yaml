openapi: 3.0.3
info:
  title: Gamified Evidence-Based Nursing API
  version: 1.0.0
  description: OpenAPI spec generated from Spring controller mappings in this repository.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Game
  - name: Team
  - name: Room
  - name: Leaderboard
  - name: Completion
  - name: Admin

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: registerApiAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: loginApiAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/authenticate:
    post:
      tags: [Auth]
      operationId: authenticateApiAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/register:
    post:
      tags: [Auth]
      operationId: registerLegacyAuth
      deprecated: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
  /auth/login:
    post:
      tags: [Auth]
      operationId: loginLegacyAuth
      deprecated: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/authenticate:
    post:
      tags: [Auth]
      operationId: authenticateLegacyAuth
      deprecated: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/game/create:
    post:
      tags: [Game]
      operationId: createGame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGameRequest'
      responses:
        '200':
          description: Game created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResponseDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/teams/{teamId}:
    get:
      tags: [Team]
      operationId: getTeam
      parameters:
        - $ref: '#/components/parameters/teamIdPath'
      responses:
        '200':
          description: Team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/teams/game/{gameId}:
    get:
      tags: [Team]
      operationId: getTeamsByGame
      parameters:
        - $ref: '#/components/parameters/gameIdPath'
      responses:
        '200':
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/teams/{teamId}/progress:
    get:
      tags: [Team]
      operationId: getTeamProgress
      parameters:
        - $ref: '#/components/parameters/teamIdPath'
      responses:
        '200':
          description: Team progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamProgressResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/rooms/{roomId}/status:
    get:
      tags: [Room]
      operationId: getRoomStatus
      parameters:
        - $ref: '#/components/parameters/roomIdPath'
        - $ref: '#/components/parameters/teamIdQuery'
      responses:
        '200':
          description: Room status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/rooms/{roomId}/questions:
    get:
      tags: [Room]
      operationId: getRoomQuestions
      parameters:
        - $ref: '#/components/parameters/roomIdPath'
        - $ref: '#/components/parameters/teamIdQuery'
      responses:
        '200':
          description: Questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuestionDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/rooms/{roomId}/submit-answer:
    post:
      tags: [Room]
      operationId: submitAnswer
      parameters:
        - $ref: '#/components/parameters/roomIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswerRequest'
      responses:
        '200':
          description: Submission result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitAnswerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/rooms/{roomId}/questions/{questionId}/hint:
    post:
      tags: [Room]
      operationId: getHint
      parameters:
        - $ref: '#/components/parameters/roomIdPath'
        - $ref: '#/components/parameters/questionIdPath'
        - $ref: '#/components/parameters/teamIdQuery'
      responses:
        '200':
          description: Hint text
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/rooms/{roomId}/questions/{questionId}/skip:
    post:
      tags: [Room]
      operationId: skipQuestion
      parameters:
        - $ref: '#/components/parameters/roomIdPath'
        - $ref: '#/components/parameters/questionIdPath'
        - $ref: '#/components/parameters/teamIdQuery'
      responses:
        '200':
          description: Updated room status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/rooms/room-of-knowledge:
    get:
      tags: [Room]
      operationId: getRoomOfKnowledgeQuestionList
      parameters:
        - name: gameId
          in: query
          required: true
          schema:
            type: integer
            format: int64
        - name: mission
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Mission'
        - name: password
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of Room of Knowledge questions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoomOfKnowledgeQuestionDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/leaderboard/games/{gameId}:
    get:
      tags: [Leaderboard]
      operationId: getGameLeaderboard
      parameters:
        - $ref: '#/components/parameters/gameIdPath'
      responses:
        '200':
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaderboardEntryDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/leaderboard/games/{gameId}/my-position:
    get:
      tags: [Leaderboard]
      operationId: getMyPosition
      parameters:
        - $ref: '#/components/parameters/gameIdPath'
        - $ref: '#/components/parameters/teamIdQuery'
      responses:
        '200':
          description: Team position
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardEntryDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/leaderboard/games/{gameId}/top:
    get:
      tags: [Leaderboard]
      operationId: getTopTeams
      parameters:
        - $ref: '#/components/parameters/gameIdPath'
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            default: 10
      responses:
        '200':
          description: Top teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaderboardEntryDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/leaderboard/global:
    get:
      tags: [Leaderboard]
      operationId: getGlobalLeaderboard
      responses:
        '200':
          description: Global leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaderboardEntryDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/leaderboard/global/mission/{mission}:
    get:
      tags: [Leaderboard]
      operationId: getMissionLeaderboard
      parameters:
        - name: mission
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Mission leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaderboardEntryDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/leaderboard/filter:
    post:
      tags: [Leaderboard]
      operationId: getFilteredLeaderboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaderboardFilterDto'
      responses:
        '200':
          description: Filtered leaderboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaderboardEntryDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/leaderboard/games/{gameId}/teams/{teamId}/history:
    get:
      tags: [Leaderboard]
      operationId: getTeamHistory
      parameters:
        - $ref: '#/components/parameters/gameIdPath'
        - $ref: '#/components/parameters/teamIdPath'
      responses:
        '200':
          description: Team ranking history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaderboardHistoryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/leaderboard/games/{gameId}/teams/{teamId}/neighbors:
    get:
      tags: [Leaderboard]
      operationId: getTeamNeighbors
      parameters:
        - $ref: '#/components/parameters/gameIdPath'
        - $ref: '#/components/parameters/teamIdPath'
        - name: range
          in: query
          schema:
            type: integer
            format: int32
            default: 2
      responses:
        '200':
          description: Neighbor teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaderboardEntryDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/leaderboard/games/{gameId}/live:
    get:
      tags: [Leaderboard]
      operationId: getLiveSubscriptionInfo
      parameters:
        - $ref: '#/components/parameters/gameIdPath'
      responses:
        '200':
          description: Live subscription metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardLiveInfoDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/completion/teams/{teamId}/status:
    get:
      tags: [Completion]
      operationId: checkTeamCompletion
      parameters:
        - $ref: '#/components/parameters/teamIdPath'
      responses:
        '200':
          description: Completion status
          content:
            application/json:
              schema:
                type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/completion/teams/{teamId}/complete:
    post:
      tags: [Completion]
      operationId: completeTeamGame
      parameters:
        - $ref: '#/components/parameters/teamIdPath'
      responses:
        '200':
          description: Team completion details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameCompletionDto'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/completion/games/{gameId}/check:
    get:
      tags: [Completion]
      operationId: checkGameCompletion
      parameters:
        - $ref: '#/components/parameters/gameIdPath'
      responses:
        '200':
          description: Game result if complete, otherwise null
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: '#/components/schemas/GameResultDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/completion/games/{gameId}/results:
    get:
      tags: [Completion]
      operationId: getGameResults
      parameters:
        - $ref: '#/components/parameters/gameIdPath'
      responses:
        '200':
          description: Final game results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResultDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/completion/games/{gameId}/force-end:
    post:
      tags: [Completion]
      operationId: forceEndGame
      description: Requires ADMIN role.
      parameters:
        - $ref: '#/components/parameters/gameIdPath'
      responses:
        '200':
          description: Forced final result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameResultDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/completion/games/{gameId}/winner:
    get:
      tags: [Completion]
      operationId: getWinner
      parameters:
        - $ref: '#/components/parameters/gameIdPath'
      responses:
        '200':
          description: Winner details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WinnerResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No winner available
  /api/admin/isThereAdmin:
    get:
      tags: [Admin]
      operationId: isThereAdmin
      security: []
      responses:
        '200':
          description: Whether an administrator game exists
          content:
            application/json:
              schema:
                type: boolean
  /api/admin/games:
    get:
      tags: [Admin]
      operationId: getAllAdminGames
      description: Requires ADMIN role.
      responses:
        '200':
          description: All games for admin dashboard
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminGameDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/games/{gameId}:
    get:
      tags: [Admin]
      operationId: getAdminGameDetails
      description: Requires ADMIN role.
      parameters:
        - $ref: '#/components/parameters/gameIdPath'
      responses:
        '200':
          description: Game details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGameDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin]
      operationId: deleteAdminGame
      description: Requires ADMIN role.
      parameters:
        - $ref: '#/components/parameters/gameIdPath'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/games/{gameId}/teams:
    get:
      tags: [Admin]
      operationId: getAdminGameTeams
      description: Requires ADMIN role.
      parameters:
        - $ref: '#/components/parameters/gameIdPath'
      responses:
        '200':
          description: Teams in game
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminTeamDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/games/{gameId}/teams/{teamId}:
    get:
      tags: [Admin]
      operationId: getAdminTeamDetails
      description: Requires ADMIN role.
      parameters:
        - $ref: '#/components/parameters/gameIdPath'
        - $ref: '#/components/parameters/teamIdPath'
      responses:
        '200':
          description: Team details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTeamDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/admin/games/{gameId}/start:
    post:
      tags: [Admin]
      operationId: startAdminGame
      description: Requires ADMIN role.
      parameters:
        - $ref: '#/components/parameters/gameIdPath'
      responses:
        '200':
          description: Updated game state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGameDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/games/{gameId}/end:
    post:
      tags: [Admin]
      operationId: endAdminGame
      description: Requires ADMIN role.
      parameters:
        - $ref: '#/components/parameters/gameIdPath'
      responses:
        '200':
          description: Updated game state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGameDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/games/{gameId}/teams/{teamId}/reset:
    post:
      tags: [Admin]
      operationId: resetAdminTeamProgress
      description: Requires ADMIN role.
      parameters:
        - $ref: '#/components/parameters/gameIdPath'
        - $ref: '#/components/parameters/teamIdPath'
      responses:
        '200':
          description: Reset team state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTeamDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/games/{gameId}/analytics:
    get:
      tags: [Admin]
      operationId: getAdminGameAnalytics
      description: Requires ADMIN role.
      parameters:
        - $ref: '#/components/parameters/gameIdPath'
      responses:
        '200':
          description: Game analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnalyticsDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/analytics:
    get:
      tags: [Admin]
      operationId: getAdminGlobalAnalytics
      description: Requires ADMIN role.
      responses:
        '200':
          description: Global analytics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAnalyticsDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/games/{gameId}/export:
    get:
      tags: [Admin]
      operationId: exportAdminGameResults
      description: Requires ADMIN role.
      parameters:
        - $ref: '#/components/parameters/gameIdPath'
      responses:
        '200':
          description: CSV export
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    gameIdPath:
      name: gameId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    teamIdPath:
      name: teamId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    roomIdPath:
      name: roomId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    questionIdPath:
      name: questionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    teamIdQuery:
      name: teamId
      in: query
      required: true
      schema:
        type: integer
        format: int64

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required: [token, isAdmin]
      properties:
        token:
          type: string
        isAdmin:
          type: boolean

    CreateGameRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string

    GameResponseDto:
      type: object
      properties:
        gameId:
          type: integer
          format: int64
        teamMissions:
          type: object
          additionalProperties:
            type: integer
            format: int64

    TeamDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        mission:
          type: string
        status:
          type: string
        location:
          type: string
        isWinner:
          type: boolean
        gameId:
          type: integer
          format: int64

    TeamProgressResponse:
      type: object
      properties:
        teamId:
          type: integer
          format: int64
        currentRoom:
          type: integer
          format: int32
        totalScore:
          type: integer
          format: int32
        questionsAnswered:
          type: integer
          format: int32
        isWinner:
          type: boolean

    QuestionDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        image:
          type: string
          nullable: true
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerDto'

    RoomOfKnowledgeQuestionDto:
      type: object
      properties:
        question:
